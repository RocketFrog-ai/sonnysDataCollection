# The one environment. Backend, Streamlit app, model, council -- all of it.
#
#   conda env create -f environment.yml
#   conda activate sonnys
#
#   uvicorn app.main:app --port 8010          # the API
#   streamlit run proforma/ui/app.py          # the UI
#   scripts/smoke.sh                          # prove the numbers still match
#
# There used to be three interpreters (a py3.9 `sonnysDataCollection` for the backend, a py3.11
# `proforma311` for Streamlit, and a py3.13 `venv/`), because py3.9 caps Streamlit at 1.50. Nothing
# needed py3.9, so they collapsed into this. Remove the old ones:
#   conda env remove -n sonnysDataCollection && conda env remove -n proforma311
#
# ---------------------------------------------------------------------------------------------
# WHY scipy IS PINNED TO AN EXACT VERSION, AND WHY YOU MAY NOT CASUALLY BUMP IT
#
# It is pinned to the version the golden baseline was CAPTURED under -- not to an old one. Bumping
# it moves a number, so the bump has to be its own commit.
#
# app/pnl_analysis/modelling/pnl.py::opex_pct_curve_fit fits the opex%-of-revenue decay curve with
# scipy.optimize.curve_fit -- a bounded non-linear least-squares that terminates on a TOLERANCE
# (ftol/xtol/gtol default to 1e-8), not on exactness. Its fitted parameters are therefore only
# defined to ~1e-8, and different scipy builds walk different step paths and stop at different
# points. Measured, scipy 1.13.1 -> 1.17.1, on inputs verified bit-identical by sha256:
#
#     tau  2.4609460487255252  ->  2.4609460460784720     (1.1e-9 relative)
#
# `opex = shape x revenue` inherits that, and `net = revenue - expenses` amplifies it by
# cancellation to 1.4e-9 -- past the 1e-9 the golden harness enforces. In dollars it is 5.3e-06 on
# a monthly net of -3733.52, i.e. nothing. Nothing else in the repo is affected: pandas 2.2 -> 3.0
# and numpy 2.0 -> 2.4 change no number anywhere.
#
# To upgrade: bump scipy, run `scripts/smoke.sh --capture-baseline`, verify that ONLY
# cases.expense_plan moves, and commit the re-baselined api.json ON ITS OWN so the diff is
# attributable. scripts/smoke.sh asserts this version up front and fails loudly, so a stray
# `pip install -U scipy` cannot surface later as a mystery 1.4e-9. See docs/ENVIRONMENTS.md.
# ---------------------------------------------------------------------------------------------

name: sonnys

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  - pip:
    # --- numeric core. Pinned; the golden baseline is captured against exactly these. ---
    - numpy==2.4.4
    - pandas==3.0.2
    - scipy==1.17.1             # PINNED -- see the header. Bumping this moves expense_plan.
    - scikit-learn==1.8.0       # unpickles coldstart_artifacts.joblib (fitted under 1.6.1)
    - lightgbm==4.6.0
    - joblib==1.5.3

    # --- Streamlit app (proforma/ui) ---
    - streamlit==1.58.0         # needs py>=3.10; this is why the py3.9 env had to go
    - plotly==6.6.0
    - folium==0.20.0
    - streamlit-folium==0.27.2

    # --- FastAPI backend (app/) ---
    - fastapi>=0.115            # <0.115 pins starlette<0.40, which streamlit 1.58 refuses
    - uvicorn==0.51.0
    - httpx==0.28.1
    - pydantic==2.13.4
    - requests==2.32.5
    - python-dotenv==1.2.2

    # --- insights layer (app/pnl_analysis/insights). Lazily imported; the API serves without them. ---
    - openai>=2.16              # Azure + local chat backends
    - langgraph>=0.2            # 2-node Key-Insights graph; falls back to a sequential runner if absent
    - beautifulsoup4>=4.12      # websearch result parsing
    - ddgs>=9                   # web search (was `duckduckgo-search`; both names are handled)

    # --- everything else that is actually imported ---
    - openpyxl==3.1.5           # proforma/backtests reads .xlsx proformas
    - rapidfuzz>=3              # libs/carwash_type name matching
    - tqdm>=4.67                # experiments/council + experiments/datafetching
