# Conda env for running the proforma Streamlit app on Python 3.11
# (the backend `sonnysDataCollection` env is Python 3.9, which caps Streamlit at 1.50).
#
# NOTE on the artifact: this env pins scikit-learn 1.8.0, but
# proforma/artifacts/coldstart_artifacts.joblib was fitted under scikit-learn 1.6.1 (the
# BACKEND env). Loading it here emits InconsistentVersionWarning. As of 2026-07 the outputs are
# bit-identical across the two versions -- verified by running the full golden capture under both
# envs -- so the warning is cosmetic today. sklearn does not guarantee that. Refit for the env
# that must unpickle it, which is the backend. See docs/ENVIRONMENTS.md.
#
# Create:   conda env create -f environment-proforma311.yml   # add --solver=libmamba on slow links
# Activate: conda activate proforma311
# Run:      streamlit run proforma/ui/app.py \
#               --server.port 8080 --server.address 0.0.0.0 --server.headless true

name: proforma311

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  - pip:
    # --- Streamlit + viz stack ---
    - streamlit==1.58.0
    - plotly==6.6.0
    - folium==0.20.0
    - streamlit-folium==0.27.2
    - pyarrow==24.0.0
    - altair==6.1.0

    # --- data / model stack (these versions unpickle the saved model) ---
    - numpy==2.4.4
    - pandas==3.0.2
    - scipy==1.17.1
    - scikit-learn==1.8.0
    - lightgbm==4.6.0
    - joblib==1.5.3
    - openpyxl==3.1.5

    # --- backend modules imported by site_analysis_page (lightweight; heavy AI deps are lazy) ---
    - requests==2.32.5
    - python-dotenv==1.2.2
    - geopandas==1.1.3
    - langgraph>=0.2          # Explore-markets Key-Insights pipeline (2-node graph); falls back to a sequential runner if absent
